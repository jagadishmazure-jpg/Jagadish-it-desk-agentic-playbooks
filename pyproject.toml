[project]
name = "it-desk-agentic-playbooks"
version = "0.1.0"
description = "Agentic IT service desk on simulated systems: triage, playbooks, risk-tiered tool gateway, approvals, SLA, measured eval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.5.4", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
measure = ["llama-cpp-python==0.3.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["itdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
